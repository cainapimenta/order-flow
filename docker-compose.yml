name: order-flow

services:
  postgres:
    image: postgres:17-alpine
    container_name: order-flow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: order-flow-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: order-flow-rabbitmq
    hostname: order-flow-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq-init:
    image: curlimages/curl:8.12.1
    container_name: order-flow-rabbitmq-init
    restart: "no"

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    volumes:
      - ./infra/rabbitmq/definitions.json:/definitions.json:ro

    entrypoint:
      - /bin/sh
      - -ec
      - |
        curl --fail-with-body --silent --show-error \
          --retry 15 \
          --retry-delay 2 \
          --retry-connrefused \
          --user "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" \
          --header "Content-Type: application/json" \
          --data-binary @/definitions.json \
          http://rabbitmq:15672/api/definitions

  frontend:
    image: node:24-alpine
    container_name: order-flow-frontend
    working_dir: /app

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:
  frontend_node_modules:
